name: Auto Sync Movies from Servers

on:
  schedule:
    # Run automatically every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Movie Synchronization Script
        run: node scripts/sync-movies.js

      - name: Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies_3000.json sitemap.xml
          if git diff --staged --quiet; then
            echo "No new movies found to commit."
          else
            git commit -m "Auto-sync movie catalog and sitemap from servers [skip ci]"
            git push origin main
          fi
