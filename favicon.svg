<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1424" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Letter A & Icon Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Play Button Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Ambient Cinematic Glows -->
  <circle cx="256" cy="230" r="140" fill="#00f2fe" opacity="0.22" filter="url(#subtleGlow)" />
  <circle cx="280" cy="300" r="120" fill="#9333ea" opacity="0.2" filter="url(#subtleGlow)" />

  <!-- Border Frame -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="14" opacity="0.85" />

  <!-- Stylized Geometric "A" Frame -->
  <g filter="url(#neonGlow)">
    <!-- Left Leg of A -->
    <path d="M 256 86 
             C 246 86, 238 92, 232 102 
             L 122 344 
             C 114 362, 127 382, 147 382 
             L 182 382 
             C 196 382, 208 373, 213 360 
             L 236 304 
             L 276 304 
             L 256 250 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Right Leg of A -->
    <path d="M 256 86 
             C 266 86, 274 92, 280 102 
             L 390 344 
             C 398 362, 385 382, 365 382 
             L 330 382 
             C 316 382, 304 373, 299 360 
             L 276 304 
             L 236 304 
             L 256 250 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Dynamic Cinema Play Arrow (Centered inside the A) -->
    <path d="M 226 215 
             C 226 205, 237 199, 246 204 
             L 326 251 
             C 335 256, 335 268, 326 273 
             L 246 320 
             C 237 325, 226 319, 226 309 
             Z" 
          fill="url(#playGrad)" 
          stroke="#ffffff" 
          stroke-width="4" />

    <!-- Upper Sparkle / Cinematic Star Accent -->
    <circle cx="256" cy="86" r="14" fill="#ffffff" />
  </g>

  <!-- Film Perforation Dots on Base (Cinematic Identity) -->
  <circle cx="160" cy="436" r="7" fill="#00f2fe" opacity="0.6" />
  <circle cx="208" cy="436" r="7" fill="#00f2fe" opacity="0.6" />
  <circle cx="256" cy="436" r="7" fill="#38bdf8" opacity="0.8" />
  <circle cx="304" cy="436" r="7" fill="#a855f7" opacity="0.6" />
  <circle cx="352" cy="436" r="7" fill="#a855f7" opacity="0.6" />
</svg>
